name: Publish sweep

# Turns a scheduled post into a live one.
#
# The site is statically generated: nothing on leopixels.com re-evaluates
# "is it 09:00 yet". A post whose publishedAt has passed stays invisible until
# something rebuilds. This is that something.
#
# It does not build anything itself. It asks blog-status whether a post became
# due in the last window and, if so, pokes a Vercel Deploy Hook. Vercel does the
# build, from main, exactly as it would for a push.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY HOURLY, AND WHAT THAT COSTS
# ─────────────────────────────────────────────────────────────────────────────
# Publishing precision equals this cron's granularity: a post dated 09:00 goes
# live within the hour after 09:00, not at 09:00 exactly. GitHub's scheduled
# runs are also best-effort and are commonly delayed under load, so treat the
# timestamp as "not before", never "exactly at".
#
# Note also that GitHub disables scheduled workflows after 60 days of repository
# inactivity. Weekly automated posts keep it alive; a long pause does not.

on:
  schedule:
    # Every hour, on the hour (UTC). Matches the UTC-everywhere rule in
    # content/blog/schedule.ts.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Deploy even if nothing became due (use after fixing a missed run)'
        type: boolean
        default: false
      window_minutes:
        description: 'How far back to look for newly due posts'
        type: string
        default: '70'

concurrency:
  group: publish-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    name: Publish anything now due
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24, matching the toolchain that generates package-lock.json.
          # This is load-bearing: node 22 ships npm 10, which computes a
          # different dependency tree from the same package.json and rejects an
          # npm 11 lockfile with "Missing: @emnapi/runtime" and friends. Keep
          # this aligned with the version used locally, or npm ci breaks on
          # every dependency change.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The window is deliberately wider than the cron interval (70 > 60) so
      # scheduler jitter cannot drop a post through the gap. The overlap can at
      # worst cause one redundant deploy, which is harmless: a rebuild of
      # unchanged content produces the same site.
      - name: Check for newly due posts
        id: status
        run: |
          npm run blog:status -- \
            --due-within-minutes "${{ github.event.inputs.window_minutes || '70' }}" \
            --github-output

      - name: Report
        run: |
          echo "automation enabled : ${{ steps.status.outputs.automation_enabled }}"
          echo "newly due          : ${{ steps.status.outputs.due_count }}"
          echo "due slugs          : ${{ steps.status.outputs.due_slugs }}"
          echo "published total    : ${{ steps.status.outputs.published_count }}"
          echo "still scheduled    : ${{ steps.status.outputs.scheduled_count }}"
          echo "next go-live       : ${{ steps.status.outputs.next_go_live }}"

      # THE KILL SWITCH. blog-status reports due=false whenever
      # blogSchedule.enabled is false, so flipping that one flag stops
      # deployments without touching this file.
      - name: Automation disabled
        if: steps.status.outputs.automation_enabled != 'true'
        run: |
          echo "::notice::blogSchedule.enabled is false. No deployment triggered."
          echo "Set enabled: true in content/blog/schedule.ts to resume."

      - name: Nothing to publish
        if: steps.status.outputs.automation_enabled == 'true' && steps.status.outputs.due == 'false' && github.event.inputs.force != 'true'
        run: echo "::notice::No post became due in the window. No deployment triggered."

      # Fail loudly rather than silently skipping: a sweep that can never
      # deploy is worse than one that errors, because it looks like it is working.
      - name: Verify deploy hook is configured
        if: steps.status.outputs.due == 'true' || github.event.inputs.force == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::A post is due but VERCEL_DEPLOY_HOOK_URL is not set."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Deploy hook is configured."

      - name: Trigger Vercel deployment
        if: (steps.status.outputs.due == 'true' || github.event.inputs.force == 'true') && steps.status.outputs.automation_enabled == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering deployment for: ${{ steps.status.outputs.due_slugs }}"
          code=$(curl -s -o /tmp/hook-response.json -w '%{http_code}' -X POST "$HOOK")
          echo "Deploy hook responded HTTP $code"
          cat /tmp/hook-response.json || true
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Deploy hook returned HTTP $code. The post did not publish."
            exit 1
          fi
          echo "::notice::Deployment triggered for ${{ steps.status.outputs.due_slugs }}"

      # Optional. Only fires if you have chosen to configure a webhook; absent,
      # the step is skipped and the run still fails visibly in the Actions tab.
      - name: Notify on failure
        if: failure() && env.NOTIFY_WEBHOOK_URL != ''
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          curl -s -X POST -H 'content-type: application/json' \
            -d "{\"text\":\"LeoPixels publish sweep failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$NOTIFY_WEBHOOK_URL" || true
