name: Validate blog

# The quality gate for blog changes.
#
# This is what makes unattended publishing safe: a post reaches main only after
# a clean checkout has re-run every deterministic check. The generating agent
# runs the same commands in its own sandbox, but a sandbox is not the build
# environment, so nothing is trusted until it passes here.
#
# Runs on pull requests only. Pushing to main does not need it, because Vercel
# builds main anyway and a failed build there simply keeps the previous deploy.

on:
  pull_request:
    paths:
      - 'content/blog/**'
      - 'components/blog/**'
      - 'app/[locale]/blog/**'
      - 'lib/seo/**'
      - 'lib/schema.ts'
      - 'lib/nav.ts'
      - 'scripts/blog-*.ts'
      - 'messages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-blog.yml'
  workflow_dispatch:

# One run per branch. A second push supersedes the first rather than racing it.
concurrency:
  group: validate-blog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24, matching the toolchain that generates package-lock.json.
          # This is load-bearing: node 22 ships npm 10, which computes a
          # different dependency tree from the same package.json and rejects an
          # npm 11 lockfile with "Missing: @emnapi/runtime" and friends. Keep
          # this aligned with the version used locally, or npm ci breaks on
          # every dependency change.
          node-version: '24'
          cache: 'npm'

      - name: Environment
        run: |
          echo "node $(node --version)"
          echo "npm  $(npm --version)"

      # ci, not install: installs exactly the lockfile, and fails if
      # package.json and the lockfile disagree.
      - name: Install dependencies
        id: install
        run: npm ci

      # Every script in this job runs through tsx, which is a devDependency.
      # Asserting it landed turns a later, confusing `tsx: not found` into an
      # explicit statement about the install, at the step that caused it.
      - name: Verify the toolchain installed
        run: |
          if [ ! -x node_modules/.bin/tsx ]; then
            echo "::error::npm ci completed but node_modules/.bin/tsx is missing."
            echo "tsx is a devDependency, so this usually means dev dependencies were"
            echo "omitted (NODE_ENV=production, npm config production=true, or an"
            echo "--omit=dev flag reaching npm from the environment)."
            echo ""
            echo "npm config (production/omit):"
            npm config get production || true
            npm config get omit || true
            exit 1
          fi
          echo "tsx present: $(node -p "require('./package.json').devDependencies.tsx")"

      # Content checks first. They are the fastest and the most likely to fail
      # on an automated post, so failing here saves the slower steps.
      #
      # --external verifies every cited URL actually resolves. --strict promotes
      # warnings (a missing translation, a post absent from the ledger) into
      # errors, because on a pull request those are worth stopping for.
      - name: Blog content lint
        run: npm run blog:lint -- --external --strict

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      # Prints published/scheduled/draft counts and the next go-live into the
      # run log, so a reviewer can see what the PR does to the schedule without
      # reading the diff.
      #
      # `always()` is deliberate: the schedule summary is worth having even when
      # an earlier validation step failed. But it is qualified on the install,
      # because a bare `always()` here runs this step into an empty
      # node_modules when `npm ci` fails, and reports `tsx: not found` as the
      # job's error. That buries the real failure under a symptom, which is
      # exactly what happened on the first manual run of this workflow.
      - name: Blog status
        if: always() && steps.install.outcome == 'success'
        run: npm run blog:status
