<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Leo Pixels</title>
  <meta name="description" content="Leo Pixels — coming soon.">
  <style>
    :root { --ink: #111318; --muted: #6b7280; --bg: #fafafa; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }
    h1 { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 600; margin: 0; letter-spacing: -0.02em; }
    p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #f5f5f5; --muted: #9ca3af; --bg: #0b0d11; }
    }
  </style>
</head>
<body>
  <h1>Hello world GitHub New</h1>
  <p>Leo Pixels</p>
</body>
</html>
